<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Statuspage{% endblock %}</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; color: #18181b; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    .muted { color: #71717a; }
    section { border: 1px solid #e4e4e7; border-radius: .75rem; padding: 1.25rem; margin-top: 1.5rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; gap: .75rem; align-items: center; padding: .35rem 0; }
    form.inline { display: inline; margin: 0; }
    .badge { border-radius: .3rem; padding: .05rem .5rem; font-size: .875rem; background: #fef3c7; }
    .badge.ok { background: #dcfce7; }
    .alert { color: #b91c1c; }
    .notice { color: #15803d; }
    input { padding: .45rem .7rem; border: 1px solid #d4d4d8; border-radius: .5rem; }
    button { padding: .45rem 1rem; border: 0; border-radius: .5rem; background: #18181b; color: white; cursor: pointer; }
    button.link { background: none; color: inherit; text-decoration: underline; padding: 0; }
    code { font-size: .9rem; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
